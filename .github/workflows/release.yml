name: Release

# Triggered by pushing a v* tag (see scripts/changelog-release.sh for the
# assembly + tagging steps). Verifies the release invariants BEFORE building
# anything: a release with a missing/empty changelog section or a version
# mismatch must fail loudly, never publish silently.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^version = \"${VERSION}\"$" Cargo.toml; then
            echo "❌ Tag ${GITHUB_REF_NAME} does not match Cargo.toml:"
            grep -m1 '^version = ' Cargo.toml
            exit 1
          fi
          echo "✅ Cargo.toml version matches ${GITHUB_REF_NAME}"

      - name: Check CHANGELOG.md has this release's section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "❌ CHANGELOG.md has no '## [${VERSION}]' section — run"
            echo "   scripts/changelog-release.sh ${VERSION} before tagging"
            exit 1
          fi
          echo "✅ CHANGELOG.md section found"

      - name: Check no unconsumed fragments
        run: |
          LEFTOVER=$(find changelog.d -name '*.md' ! -name 'README.md')
          if [[ -n "$LEFTOVER" ]]; then
            echo "❌ Unconsumed changelog fragments — the release commit must"
            echo "   consume every fragment (scripts/changelog-release.sh):"
            echo "$LEFTOVER"
            exit 1
          fi
          echo "✅ No leftover fragments"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Dry-run publish (packaging sanity)
        run: cargo publish --dry-run --locked

  build:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --all-features --locked

      - name: Setup managed build SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore locked dependencies, check licenses, package SDK companion
        if: runner.os != 'Windows'
        run: python .tethys-82a6/oracles/worker_qualification.py --host sdk --prepare

      - name: Package SDK and Framework using actual VS 17.14
        if: runner.os == 'Windows'
        run: python .tethys-82a6/oracles/worker_qualification.py --host windows --prepare

      - name: Qualify SDK metadata and clean installation
        run: python .tethys-82a6/oracles/worker_qualification.py --host sdk

      - name: Qualify classic metadata and clean VS installation
        if: runner.os == 'Windows'
        run: python .tethys-82a6/oracles/worker_qualification.py --host windows

      - name: Stage complete distribution
        shell: python
        run: |
          import os, shutil
          binary = 'tethys.exe' if os.name == 'nt' else 'tethys'
          shutil.copy2('target/release/' + binary, 'target/worker-dist/' + binary)

      - name: Upload binary (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tethys-linux
          path: target/worker-dist/

      - name: Upload binary (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tethys-macos
          path: target/worker-dist/

      - name: Upload binary (Windows)
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: tethys-windows
          path: target/worker-dist/

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "❌ Extracted release notes are empty"
            exit 1
          fi
          echo "── release notes ──"
          cat release-notes.md

      - name: Stage release assets
        run: |
          chmod +x dist/tethys-linux/tethys dist/tethys-macos/tethys
          tar -czf tethys-linux.tar.gz -C dist/tethys-linux .
          tar -czf tethys-macos.tar.gz -C dist/tethys-macos .
          (cd dist/tethys-windows && zip -r ../../tethys-windows.zip .)
          # Retain standalone Rust assets; complete bundles carry the companion.
          cp dist/tethys-linux/tethys tethys-linux
          cp dist/tethys-macos/tethys tethys-macos
          cp dist/tethys-windows/tethys.exe tethys-windows.exe

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            tethys-linux tethys-macos tethys-windows.exe \
            tethys-linux.tar.gz tethys-macos.tar.gz tethys-windows.zip
