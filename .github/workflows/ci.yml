name: CI

on:
  push:
    branches: [main]
  # Stacked PRs need the same gates as PRs targeting main.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel superseded runs on a PR branch when it's re-pushed, but never cancel
# a run on main (keep main's history fully validated). One lane per ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Validate commit messages follow conventional commits
  commitlint:
    name: Validate Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          # Fetch base branch to ensure it's available
          git fetch origin ${{ github.base_ref }}

          # Get commits in PR
          COMMITS=$(git log --format="%s" origin/${{ github.base_ref }}..HEAD)

          # Regex for conventional commits
          # - Type is required (feat, fix, etc.)
          # - Scope is optional, lowercase with hyphens (e.g., cli, mcp)
          # - Breaking change indicator (!) is optional
          # - Description must be at least 3 characters
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\([a-z][a-z0-9-]*\))?!?: .{3,}"

          FAILED=0
          while IFS= read -r msg; do
            if [[ -z "$msg" ]]; then
              continue
            fi
            if [[ ! "$msg" =~ $PATTERN ]] && [[ ! "$msg" =~ ^Merge ]]; then
              echo "❌ Invalid commit: $msg"
              FAILED=1
            else
              echo "✅ Valid commit: $msg"
            fi
          done <<< "$COMMITS"

          if [[ $FAILED -eq 1 ]]; then
            echo ""
            echo "Expected format: <type>[optional scope]: <description>"
            echo "Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore"
            echo "Scopes should be lowercase (e.g., lsp, db, languages, cli)"
            echo "Description must be at least 3 characters"
            exit 1
          fi
          echo ""
          echo "All commits follow conventional format!"

  # Require a changelog fragment in every PR (label skip-changelog to exempt).
  # Presence is checked here (only CI sees the PR diff); the fragment's
  # format is fenced by tests/changelog_lint.rs in the test job.
  changelog:
    name: Changelog Fragment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for a changelog fragment
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          if [[ " ${PR_LABELS} " == *" skip-changelog "* ]]; then
            echo "skip-changelog label present — no fragment required"
            exit 0
          fi

          # Fetch base branch to ensure it's available
          git fetch origin ${{ github.base_ref }}

          # Fragments are ADDED files: each PR ships its own distinct file
          # (that's what keeps parallel PRs conflict-free), so a merge-base
          # diff filtered to additions is the whole check.
          if ! DIFF=$(git diff --name-only --diff-filter=A \
            "origin/${{ github.base_ref }}...HEAD" -- 'changelog.d/*.md'); then
            echo "❌ git diff against the base branch failed"
            exit 1
          fi
          FRAGMENTS=$(grep -v '^changelog.d/README\.md$' <<< "$DIFF" || true)

          if [[ -z "$FRAGMENTS" ]]; then
            echo "❌ No changelog fragment in this PR."
            echo ""
            echo "Add changelog.d/<id>.<category>.md — id is the rivets ID,"
            echo "category one of: added changed deprecated removed fixed security —"
            echo "with 1-5 user-facing bullets (see changelog.d/README.md)."
            echo ""
            echo "Docs/CI/chore-only PRs: apply the 'skip-changelog' label instead."
            echo "The label is read at event time — after adding it, re-run this"
            echo "check or push again."
            exit 1
          fi

          echo "✅ Changelog fragment(s):"
          echo "$FRAGMENTS"

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          # Only run beta on Ubuntu to save CI time
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Diagnose native overflow outcome
        if: runner.os == 'macOS'
        run: cargo nextest run --all-features --lib --no-fail-fast --stress-count 100 -E 'test(=discovery::msbuild::host::tests::overflowing_stderr_terminates_process_group)'

      - name: Run tests
        run: cargo nextest run --all-features --no-fail-fast

      - name: Run doc tests
        run: cargo test --doc --all-features

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --all-features

      - name: Upload binary (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tethys-linux
          path: target/release/tethys

      - name: Upload binary (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tethys-macos
          path: target/release/tethys

      - name: Upload binary (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tethys-windows
          path: target/release/tethys.exe

  # Check that Cargo.lock is up to date
  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo-deny
        # v2 includes cargo-deny 0.19.0 with CVSS 4.0 support
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check
          arguments: --all-features

  # Ensure code coverage stays healthy
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --verbose --all-features --timeout 120 --out xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  managed-worker:
    name: Managed Worker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Match the repository's optimized test checks for runtime smoke binaries.
      CARGO_PROFILE_DEV_OPT_LEVEL: 1
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Rust for native discovery qualification
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Cache fallback cleanup removes non-Cargo files from target; package afterward.
      - name: Restore locked dependencies, check licenses, package SDK companion
        if: runner.os != 'Windows'
        run: python .tethys-82a6/oracles/worker_qualification.py --host sdk --prepare
      - name: Package SDK and Framework using actual VS 17.14
        if: runner.os == 'Windows'
        run: python .tethys-82a6/oracles/worker_qualification.py --host windows --prepare
      - name: Qualify SDK metadata and clean installation
        run: python .tethys-82a6/oracles/worker_qualification.py --host sdk
      - name: Qualify classic metadata and clean VS installation
        if: runner.os == 'Windows'
        run: python .tethys-82a6/oracles/worker_qualification.py --host windows
      - name: Install qualified Windows NuGet
        if: runner.os == 'Windows'
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '6.14.0'
      - name: Select native discovery fixture hosts
        shell: python
        run: |
          import json, os, runpy, subprocess
          from pathlib import Path
          qualification = runpy.run_path(".tethys-82a6/oracles/worker_qualification.py")
          dotnet, _ = qualification["selected_sdk"]()
          installed = subprocess.check_output([dotnet, "--list-sdks"], text=True, timeout=30)
          sdk8 = [line.split(" [", 1) for line in installed.splitlines() if line.startswith("8.")]
          assert sdk8, "Native discovery fixtures require an installed .NET 8 SDK"
          version, parent = sdk8[-1]
          selected = (Path(parent.removesuffix("]")) / version).resolve(strict=True)
          values = {
              "DOTNET": str(dotnet),
              "TETHYS_SDK_MSBUILD_PATH": str(selected),
              "TETHYS_WORKER_DISTRIBUTION": str(Path("target/worker-dist/msbuild-evaluate").resolve(strict=True)),
          }
          if os.name == "nt":
              values["TETHYS_VS_MSBUILD_PATH"] = str(qualification["selected_windows"]())
              assets = json.loads(Path("tools/tethys-msbuild-evaluate/obj/project.assets.json").read_text(encoding="utf-8"))
              sources = [Path(folder) / "newtonsoft.json/13.0.3" for folder in assets["packageFolders"]]
              source = next((path for path in sources if (path / "newtonsoft.json.13.0.3.nupkg").is_file()), None)
              assert source is not None, "Prepared worker must supply the offline package fixture"
              values["TETHYS_NUGET_FIXTURE_SOURCE"] = str(source)
              values["NUGET_CERT_REVOCATION_MODE"] = "offline"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name, value in values.items():
                  output.write(f"{name}={value}\n")
      - name: Qualify real discovery failures, currentness and cache
        # No runner-level loader cleanup: each fixture states the environment it
        # evaluates under, so harness settings cannot disqualify a receipt.
        run: cargo nextest run --all-features --lib --test discovery_candidates --test discovery_failures --test discovery_cache --test discovery_runtime --run-ignored all --no-fail-fast
      - name: Build actual CLI for discovery smoke
        run: cargo build --lib --bin tethys
      - name: Prove native cache launches and frozen Cargo output
        if: runner.os != 'Windows'
        run: python .tethys-82a6/oracles/discovery_smoke.py
      - name: Prove published discovery through packaged CLI
        run: python .tethys-82a6/oracles/discovery_smoke.py --index
      - uses: actions/upload-artifact@v4
        with:
          name: managed-worker-${{ matrix.os }}
          path: target/worker-dist/
          if-no-files-found: error

  # Summary job that requires all other jobs to pass
  ci-success:
    name: CI Success
    if: always()
    needs: [commitlint, changelog, format, lint, test, build, cargo-deny, coverage, managed-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          # commitlint and changelog are skipped on push events, so we
          # allow "skipped" result for both
          if [[ "${{ needs.commitlint.result }}" != "success" ]] && \
             [[ "${{ needs.commitlint.result }}" != "skipped" ]]; then
            echo "Commit validation failed"
            exit 1
          fi
          if [[ "${{ needs.changelog.result }}" != "success" ]] && \
             [[ "${{ needs.changelog.result }}" != "skipped" ]]; then
            echo "Changelog fragment check failed"
            exit 1
          fi
          if [[ "${{ needs.format.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.cargo-deny.result }}" != "success" ]] || \
             [[ "${{ needs.managed-worker.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
